<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài Lab 22 – Biểu Mẫu Đăng Nhập Responsive</title>
 
  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
 
  <style>
    /* ── Root variables ─────────────────────────── */
    :root {
      --brand:      #1a56db;
      --brand-dark: #1344b0;
      --surface:    #ffffff;
      --bg:         #f0f4ff;
      --text:       #111827;
      --muted:      #6b7280;
      --border:     #d1d5db;
      --radius:     14px;
      --shadow:     0 8px 40px rgba(26,86,219,.12);
    }
 
    /* ── Page ───────────────────────────────────── */
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    /* Decorative blobs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 520px; height: 520px;
      background: #93c5fd;
      top: -120px; left: -120px;
    }
    body::after {
      width: 420px; height: 420px;
      background: #a5b4fc;
      bottom: -100px; right: -80px;
    }
 
    /* ── Card ───────────────────────────────────── */
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.75rem 2.5rem;
      position: relative;
      z-index: 1;
      /* Subtle top accent line */
      border-top: 4px solid var(--brand);
      animation: slideUp .45s cubic-bezier(.22,1,.36,1) both;
    }
 
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    /* ── Brand logo area ────────────────────────── */
    .brand-icon {
      width: 52px; height: 52px;
      background: var(--brand);
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
    }
 
    .login-title {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.3px;
      margin-bottom: .25rem;
    }
 
    .login-subtitle {
      font-size: .875rem;
      color: var(--muted);
      margin-bottom: 0;
    }
 
    /* ── Labels ─────────────────────────────────── */
    .form-label {
      font-size: .8125rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .4rem;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
 
    /* ── Input group icon wrapper ───────────────── */
    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .bi {
      position: absolute;
      left: .9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color .2s;
    }
    .input-icon-wrap .form-control {
      padding-left: 2.6rem;
    }
 
    /* ── Form controls ──────────────────────────── */
    .form-control {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .9375rem;
      padding: .65rem 1rem;
      transition: border-color .2s, box-shadow .2s;
      color: var(--text);
    }
    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3.5px rgba(26,86,219,.12);
      outline: none;
    }
    .form-control:focus ~ .bi,
    .input-icon-wrap:focus-within .bi {
      color: var(--brand);
    }
 
    /* Show/hide password toggle */
    .toggle-pw {
      position: absolute;
      right: .9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--brand); }
 
    /* ── Checkbox ───────────────────────────────── */
    .form-check-label {
      font-size: .875rem;
      color: var(--muted);
      user-select: none;
    }
    .form-check-input:checked {
      background-color: var(--brand);
      border-color: var(--brand);
    }
    .form-check-input:focus {
      box-shadow: 0 0 0 3px rgba(26,86,219,.15);
    }
 
    /* ── Forgot password link ───────────────────── */
    .forgot-link {
      font-size: .875rem;
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
      transition: color .2s;
    }
    .forgot-link:hover { color: var(--brand-dark); text-decoration: underline; }
 
    /* ── Submit button ──────────────────────────── */
    .btn-login {
      background: var(--brand);
      border: none;
      border-radius: 10px;
      font-size: .9375rem;
      font-weight: 600;
      padding: .75rem;
      letter-spacing: .02em;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(26,86,219,.3);
    }
    .btn-login:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(26,86,219,.38);
    }
    .btn-login:active { transform: translateY(0); }
 
    /* ── Divider ────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: var(--border);
      font-size: .8125rem;
      color: var(--muted);
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
 
    /* ── Sign up footer ─────────────────────────── */
    .signup-text {
      font-size: .875rem;
      color: var(--muted);
      text-align: center;
    }
    .signup-text a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }
    .signup-text a:hover { text-decoration: underline; }
 
    /* ── Responsive tweaks ──────────────────────── */
    @media (max-width: 575px) {
      .login-card { padding: 2rem 1.5rem; }
      .login-title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
 
  <!-- ── Bootstrap container / grid ── -->
  <div class="container py-5">
    <div class="row justify-content-center">
 
      <!-- col rộng trên desktop, full trên mobile -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
 
        <div class="login-card">
 
          <!-- Brand -->
          <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h1 class="login-title">Đăng nhập</h1>
          <p class="login-subtitle mb-4">Chào mừng bạn quay trở lại!</p>
 
          <!-- ── Form ── -->
          <form id="loginForm" novalidate>
 
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <div class="input-icon-wrap">
                <i class="bi bi-envelope"></i>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="ten@example.com"
                  required
                  autocomplete="email"
                />
              </div>
              <div class="invalid-feedback">Vui lòng nhập địa chỉ email hợp lệ.</div>
            </div>
 
            <!-- Mật khẩu -->
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <div class="input-icon-wrap">
                <i class="bi bi-lock"></i>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="••••••••"
                  required
                  autocomplete="current-password"
                />
                <!-- Toggle hiện / ẩn mật khẩu -->
                <button
                  type="button"
                  class="toggle-pw"
                  id="togglePw"
                  aria-label="Hiện/ẩn mật khẩu"
                >
                  <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
              </div>
              <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
            </div>
 
            <!-- Ghi nhớ & Quên mật khẩu (yêu cầu mở rộng) -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check mb-0">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="remember"
                />
                <label class="form-check-label" for="remember">
                  Ghi nhớ đăng nhập
                </label>
              </div>
              <a href="#" class="forgot-link">Quên mật khẩu?</a>
            </div>
 
            <!-- Nút đăng nhập -->
            <button type="submit" class="btn btn-primary btn-login w-100 text-white">
              <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
            </button>
 
          </form>
 
          <!-- Divider -->
          <div class="divider my-4">hoặc</div>
 
          <!-- Google sign-in (minh họa) -->
          <button
            type="button"
            class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
            style="border-radius:10px; font-size:.9375rem; padding:.7rem;"
          >
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Tiếp tục với Google
          </button>
 
          <!-- Đăng ký -->
          <p class="signup-text mt-4">
            Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
          </p>
 
        </div><!-- /login-card -->
 
      </div><!-- /col -->
    </div><!-- /row -->
  </div><!-- /container -->
 
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
  <script>
    /* ── Show / hide password ── */
    const togglePw = document.getElementById('togglePw');
    const pwInput  = document.getElementById('password');
    const eyeIcon  = document.getElementById('eyeIcon');
 
    togglePw.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type   = isHidden ? 'text' : 'password';
      eyeIcon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
 
    /* ── Bootstrap form validation ── */
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        e.stopPropagation();
        this.classList.add('was-validated');
        return;
      }
      // Giả lập đăng nhập thành công
      const btn = this.querySelector('.btn-login');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý…';
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Đăng nhập thành công!';
        btn.classList.replace('btn-primary', 'btn-success');
      }, 1500);
    });
  </script>
 
</body>
</html>
